# IQM connection and backend-specific pulse settings.
# Set server_url before running run_experiment.py. No connection is made while
# importing the package or loading this file.
iqm:
  server_url: null
  quantum_computer: null
  qubits: null
  prx_implementation: null
  probability_source: thresholded_readout

# Targets and physical operating points. A one-dimensional sweep is represented
# by one axis plus any constant values under fixed. Use kind: zipped for paired
# values rather than a Cartesian product.
experiment:
  targets: [X1, X5a, X5b, X9a, X9b, H1]
  failure_policy: abort
  sweep:
    kind: cartesian
    axes:
      - name: amplitude_error
        values: [-0.02, 0.0, 0.02]
      - name: detuning_hz
        unit: Hz
        values: [-2000000.0, 0.0, 2000000.0]
    fixed: {}

# Remove a technique or set enabled: false to omit it from the experiment.
techniques:
  tomography:
    enabled: true
    shots: 1024
  transition_phase_ramsey:
    enabled: true
    shots: 1024
    phases:
      - 0.0
      - 0.39269908169872414
      - 0.7853981633974483
      - 1.1780972450961724
      - 1.5707963267948966
      - 1.9634954084936207
      - 2.356194490192345
      - 2.748893571891069
      - 3.141592653589793
      - 3.5342917352885173
      - 3.9269908169872414
      - 4.319689898685965
      - 4.71238898038469
      - 5.105088062083414
      - 5.497787143782138
      - 5.890486225480862
  interleaved_rb:
    enabled: true
    shots: 512
    lengths: [1, 2, 4, 8, 16, 32]
    samples: 10
    seed: 7
    paired_sequences: true

readout:
  enabled: true
  shots: 1024

output:
  csv: composite_experiment_results.csv
  view: legacy
