[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqm-composite-experiment"
version = "0.1.0"
description = "Extensible pulse-characterization experiments for IQM hardware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "iqm-pulla>=14,<15",
    "iqm-pulse>=14,<15",
    "numpy>=1.24",
    "pandas>=2",
    "PyYAML>=6",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["gate_experiment"]

[tool.coverage.report]
show_missing = true
skip_covered = true
