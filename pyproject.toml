[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqm-composite-experiment"
version = "0.1.0"
description = "Composite pulse characterization experiments for IQM hardware"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "iqm-pulla>=14,<15",
    "iqm-pulse>=14,<15",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2",
    "scipy>=1.10",
    "xarray",
]

[tool.setuptools.packages.find]
include = ["iqm_composite_experiment*"]
